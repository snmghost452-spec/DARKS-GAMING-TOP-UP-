<div>
  <video id="webcam" autoplay playsinline width="320" height="240"></video>
  <button id="captureBtn">Take Picture</button>
  <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
  <img id="photoOutput" alt="Your snapshot will appear here">
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');
  const photo = document.getElementById('photoOutput');
  const captureBtn = document.getElementById('captureBtn');

  // Request camera access explicitly from the user
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then((stream) => {
      video.srcObject = stream;
    })
    .catch((err) => {
      console.error("Camera access denied or unavailable:", err);
    });

  // Capture frame to canvas
  captureBtn.addEventListener('click', () => {
    const context = canvas.getContext('2d');
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Convert captured frame to image URL
    const imageData = canvas.toDataURL('image/png');
    photo.setAttribute('src', imageData);
  });
</script>
